# CONFIG_LV_Z_VDB_SIZE=50
# LVGL heap. Measured peak with the WPM panel is ~11 KB (steady state ~5.5 KB);
# the old 10000 default ran out mid-draw. Set explicitly for the same reason
# as the stack size below. 24 KB (not 16) leaves room for the Zappy Birds
# game screen, which stays allocated next to the status screen.
CONFIG_LV_Z_MEM_POOL_SIZE=24576
# Set here, not only as a Kconfig.defconfig default: ZMK's own `default 2048`
# for this symbol is evaluated first and wins over the shield's default. At
# 2048 the display thread was measured peaking at 2024 bytes (99%), with no
# stack guard to catch an overflow.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
